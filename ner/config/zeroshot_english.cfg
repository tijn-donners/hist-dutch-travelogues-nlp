[nlp]
lang = "nl"
pipeline = ["llm"]

[components]

[components.llm]
factory = "llm"
save_io = true

[components.llm.task]
@llm_tasks = "spacy.NER.v3"
labels = ["E18_Physical_Thing", "E53_Place", "Mode_of_Transportation", "E52_Time_Span", "F2_Expression", "E19_Physical_Object", "E20_Biological_Object", "E31_Document"]
description = "CRITICAL: You MUST list EVERY SINGLE occurrence of an entity as a separate numbered item. If 'Cassel' appears 5 times, you must output 5 separate lines for it. Do NOT group multiple occurrences into one line.\nCRITICAL FORMATTING RULE: Your response MUST be plain text only. Do NOT use markdown. Do NOT wrap your response in backticks (`) or code blocks (```). Output the answer directly with no surrounding formatting characters whatsoever.\nEVERY LINE MUST HAVE 4 FIELDS: text | True/False | LABEL | reason. The 4th column (reason/explanation) is MANDATORY and may not be omitted."

[components.llm.task.template]
@misc = "spacy.FileReader.v1"
path = "config/prompt_english.jinja"

[components.llm.task.label_definitions]
E18_Physical_Thing = "Tangible physical structures: buildings, bridges, monuments, mountains and other physical objects that can be seen and touched. Does not include rooms or spaces within buildings (those fall under E53_Place)"
E53_Place = "Abstract locations and spatial positions: geopolitical entities such as cities, towns and regions, geographical areas, AND rooms/sections/spaces within physical structures. Rooms and halls within a building are E53_Place, not E18_Physical_Thing."
Mode_of_Transportation = "Modes or means of transport: includes both active modes in the form of verbs (walking) and vehicle-based modes in the form of nouns (carriage). Does not include buildings (E18) or places (E53)."
E52_Time_Span = "Temporal expressions referring to time intervals, dates or durations. Includes any explicit time reference that indicates when or how long something happened."
F2_Expression = "Artistic or creative expressions: aesthetic/intellectual creations. Distinguish from E18_Physical_Thing: F2 is the immaterial expression (the composition, the design), E18 is the physical carrier (the canvas, the marble, the building)."
E19_Physical_Object = "Movable non-biological natural objects. Includes specific objects, not loose materials or raw ingredients. Distinguish from E18: E18 are buildings, bridges, mountains and other fixed structures. E19 are smaller movable objects."
E20_Biological_Object = "Subclass of E19: Movable biological natural objects. Does NOT include living animals. Distinguish from E19: everything that once lived or is derived from a living organism → E20_Biological_Object."
E31_Document = "Specific identifiable documents, books or publications. Tag ONLY when referring to a specific, uniquely identifiable document, not generic references. Distinguish from ordinary nouns: only identifiable documents qualify as E31. Generic words like 'book', 'page', 'letter', 'volumes', 'title', 'inscription' are not E31 if they do not refer to a specific document."

[components.llm.model]
context_length = 256000
@llm_models = "langchain.Ollama.v1"
name = "deepseek-v4-pro"
config = {"base_url": "https://ollama.com", "temperature": 0.1}