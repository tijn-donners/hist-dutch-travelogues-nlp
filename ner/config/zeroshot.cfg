[nlp]
lang = "nl"
pipeline = ["llm"]

[components]

[components.llm]
factory = "llm"
save_io = true

[components.llm.task]
@llm_tasks = "spacy.NER.v3"
labels = ["E18_Physical_Thing", "E53_Place", "Mode_of_Transportation", "E52_Time_Span", "F2_Expression", "E19_Physical_Object", "E20_Biological_Object", "E31_Document"]
description = "CRITICAL: You MUST list EVERY SINGLE occurrence of an entity as a separate numbered item. If 'Cassel' appears 5 times, you must output 5 separate lines for it. Do NOT group multiple occurrences into one line.\nCRITICAL FORMATTING RULE: Your response MUST be plain text only. Do NOT use markdown. Do NOT wrap your response in backticks (`) or code blocks (```). Output the answer directly with no surrounding formatting characters whatsoever.\nELKE REGEL MOET 4 VELDEN HEBBEN: text | True/False | LABEL | reden. De 4e kolom (reden/verklaring) is VERPLICHT en mag niet worden weggelaten."

[components.llm.task.template]
@misc = "spacy.FileReader.v1"
path = "config/prompt_dutch.jinja"

[components.llm.task.label_definitions]
E18_Physical_Thing = "Tastbare fysieke bouwwerken en structuren: gebouwen, bruggen, monumenten, bergen en andere fysieke objecten die je kunt zien en aanraken. Omvat geen kamers of ruimtes binnen gebouwen (die vallen onder E53_Place)"
E53_Place = "Abstracte locaties en ruimtelijke posities: geopolitieke entiteiten zoals steden, dorpen en regio's, geografische gebieden, EN kamers/vertrekken/ruimtes binnen fysieke structuren. Kamers en ruimtes en zalen binnen een gebouw zijn E53_Place, niet E18_Physical_Thing."
Mode_of_Transportation = "Vervoerswijzen of transportmiddelen: Omvat zowel actieve modi in de vorm van werkwoorden (wandelen) als voertuig-gebaseerde modi in de vorm van zelfstandig naamwoorden (koets). Omvat geen gebouwen (E18) of plaatsen (E53)."
E52_Time_Span = "Temporele uitdrukkingen die verwijzen naar tijdsintervallen, datums of tijdsduren. Omvat elke expliciete tijdsaanduiding die aangeeft wanneer of hoe lang iets gebeurde."
F2_Expression = "Artistieke of creatieve expressies: esthetische/intellectuele creaties. Onderscheid met E18_Physical_Thing: F2 is de immateriële expressie (de compositie, het ontwerp), E18 is de fysieke drager (het doek, het marmer, het gebouw)."
E19_Physical_Object = "Beweegbare niet-biologische natuurlijke objecten. Omvat specifieke objecten, geen losse materialen of grondstoffen. Onderscheid met E18: E18 zijn gebouwen, bruggen, bergen en andere vaste constructies. E19 zijn kleinere beweegbare objecten."
E20_Biological_Object = "Subclass van E19: Beweegbare biologische natuurlijke objecten. Omvat NIET levende dieren. Onderscheid met E19: alles dat ooit leefde of van een levend organisme afkomstig is → E20_Biological_Object."
E31_Document = "Specifieke identificeerbare documenten, boeken of publicaties. Tag ALLEEN als het om een specifiek, uniek identificeerbaar document gaat, niet om generieke verwijzingen. Onderscheid met gewone zelfstandige naamwoorden: alleen documenten identificerbare documenten vallen onder E31. Generieke woorden als 'boek', 'blad', 'brief', 'banden', 'titel', 'opschrift' zijn niet E31. als ze niet naar een specifiek document verwijzen."

[components.llm.model]
context_length = 256000
@llm_models = "langchain.Ollama.v1"
name = "deepseek-v4-pro"
config = {"base_url": "https://ollama.com", "temperature": 0.1}
