# Few-shot examples for ATO relation extraction
# Based on actual text from the fourth and fifth letters (BRF0004, BRF0005)
# — different from the letter being analyzed (BRF0003, Brief 3).
# Labels adapted to the pipeline tagset (E53_Place kept from source annotations,
# Mode_of_Transportation, time spans and other labels added where appropriate).
# Entity markers include mention IDs (e1, e2, ...) for citation provenance.
# No persons (E21_Person, E74_Group) — the pipeline does not model them.

# --- Example 1: Translocation (wandeling) with mode and time span ---
# Source: Brief 4, lines 10-11: walking from Kassel to Weissenstein
- text: |
