- text: |
    [Cassel](E53_Place, Q2865) verdient gewis de opmerkzaamheid van elken reiziger. Alle kostbaarheden, zoo uit het [Museum Fridericianum](E19_Physical_Thing, Q449280) als schilderyen enz, uit [Parys](E53_Place, Q90) terug gekomen zyn voor ieder vreemde te zien. Ik zal een aanvang maken met gemeld museum. In het eerste vertrek vonden wy eene groote collectie vogeleyeren. De Tweede Kamer was geheel gevuld met opgezette vogels. By het openen der derde Kamer wierd het oog getroffen door een opgezette olyphant. Van daar kwamen wy in een soort van [galery](E53_Place, null) ondersteund door zuilen. Hier waren antiquen en voorwerpen van beeldhouwkunst, doch veele stukken waren beschadigt door hun reis naar [Parys](E53_Place, Q90).
