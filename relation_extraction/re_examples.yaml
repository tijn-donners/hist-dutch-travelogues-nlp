  output:
    letter_id: "BRF0004"
    tour_group:
      id: "TG"
      label: "Tour Group Brief 4"
    events:
      - id: "RS0001"
        type: "translocation"
        label: "Wandeling van Kassel naar Weissenstein"
        moved_from: "e3"
        moved_to: "e4"
        mode_of_transportation: "e1"
        time_span: ["e2"]
        falls_within: null
        via_points: []
        viewed_artifacts: []
        mentions_places: []
        sections: []
        sub_events: []
        citations:
          - {"mention_id": "e3", "role": "moved_from"}
          - {"mention_id": "e4", "role": "moved_to"}
          - {"mention_id": "e1", "role": "mode_of_transportation"}
          - {"mention_id": "e2", "role": "time_span"}
    toponym_relations:
      e3: "FROM"
      e4: "TO"
      e5: "NEAR"

